# Provincia + San Cristóbal: /api/v1/* → Railway production-be2c
[[redirects]]
  from = "/api-proxy/*"
  to = "https://apisegurosaltoque-production-be2c.up.railway.app/:splat"
  status = 200
  force = true

# MA, RUS, ATM, Mercantil Andina (Railway; host en `api-backends.ts`)
[[redirects]]
  from = "/api-broker/*"
  to = "https://apisegurosaltoque.up.railway.app/:splat"
  status = 200
  force = true

# SPA fallback — al final
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

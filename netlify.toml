# Proxy para la API (evita CORS: el navegador pega al mismo origen)
# /api-proxy/* → Railway (Broker MA, RUS, ATM)
[[redirects]]
  from = "/api-proxy/*"
  to = "https://apisegurosaltoque.up.railway.app/:splat"
  status = 200
  force = true

# SPA fallback — debe ir siempre al final
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

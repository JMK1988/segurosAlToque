openapi: 3.0.3
info:
  title: SegurosAlToque Multicotizador API
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/v1/quotes/auto/multi:
    post:
      summary: Cotiza auto en Provincia y San Cristobal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiQuoteRequest"
      responses:
        "200":
          description: Cotizacion total o parcial exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiQuoteResponse"
        "400":
          description: Error de validacion
        "502":
          description: Ninguna aseguradora pudo cotizar
components:
  schemas:
    MultiQuoteRequest:
      type: object
      required: [person, vehicle, policy]
      properties:
        person:
          type: object
          required: [dni, fullName, email, phone, postalCode]
          properties:
            dni: { type: string }
            cuit: { type: string }
            fullName: { type: string }
            email: { type: string }
            phone: { type: string }
            postalCode: { type: string }
            provinceCode: { type: string }
            genderCode: { type: string, enum: [M, F, X] }
        vehicle:
          type: object
          required: [year, brandCode, modelCode, useCode, vehicleTypeCode, isZeroKm, insuredValue]
          properties:
            year: { type: string }
            brandCode: { type: string }
            modelCode: { type: string }
            useCode: { type: string }
            vehicleTypeCode: { type: string }
            isZeroKm: { type: boolean }
            insuredValue: { type: number }
            accessoriesAmount: { type: number }
        policy:
          type: object
          properties:
            startDateCode: { type: string }
            paymentPlanCode: { type: string }
            paymentMethodCode: { type: string }
    MultiQuoteResponse:
      type: object
      properties:
        traceId: { type: string }
        success: { type: boolean }
        results:
          type: array
          items:
            type: object
            properties:
              insurer: { type: string, enum: [provincia, san_cristobal] }
              quoteNumber: { type: string }
              quoteDate: { type: string }
              plans:
                type: array
                items:
                  type: object
                  properties:
                    planId: { type: string }
                    planName: { type: string }
                    description: { type: string }
                    monthlyPremium: { type: number }
                    annualReferencePremium: { type: number }
                    currency: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              insurer: { type: string, enum: [provincia, san_cristobal] }
              code: { type: string }
              message: { type: string }

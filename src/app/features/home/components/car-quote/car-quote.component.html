<div class="quote-card">
  <div class="quote-header">
    <div class="header-left">
      <div class="quote-icon">
        <hugeicons-icon [icon]="carIcon" [size]="24" [strokeWidth]="2"></hugeicons-icon>
      </div>
      <h3>Cotizá tu Auto</h3>
    </div>
    <span class="badge">Mejor Precio Online</span>
  </div>

  <form [formGroup]="quoteForm" (ngSubmit)="onSubmit()" class="quote-form">
    <div class="form-grid">

      <!-- Marca -->
      <div class="form-group">
        <label for="brand">Marca</label>
        <div class="input-container">
          <select id="brand" formControlName="brand" (change)="onMarcaChange($event)">
            <option value="" disabled selected>
              {{ cargandoMarcas() ? 'Cargando...' : 'Elegí Marca' }}
            </option>
            @for (marca of marcas(); track marca) {
            <option [value]="marca">{{ marca }}</option>
            }
          </select>
          @if (cargandoMarcas()) {
          <div class="loading-overlay">
            <div class="spinner"></div>
          </div>
          }
        </div>
      </div>

      <!-- Modelo -->
      <div class="form-group">
        <label for="model">Modelo</label>
        <div class="input-container">
          <select id="model" formControlName="model"
            [attr.disabled]="!quoteForm.get('brand')?.value || cargandoModelos() ? true : null"
            (change)="onModeloChange($event)">
            <option value="" disabled selected>
              @if (cargandoModelos()) { Cargando... }
              @else if (!quoteForm.get('brand')?.value) { Seleccioná marca }
              @else { Elegí Modelo }
            </option>
            @for (modelo of modelos(); track modelo) {
            <option [value]="modelo">{{ modelo }}</option>
            }
          </select>
          @if (cargandoModelos()) {
          <div class="loading-overlay">
            <div class="spinner"></div>
          </div>
          }
        </div>
      </div>

      <!-- Versión -->
      <div class="form-group">
        <label for="version">Versión</label>
        <div class="input-container">
          <select id="version" formControlName="version"
            [attr.disabled]="!quoteForm.get('model')?.value || cargandoVersiones() ? true : null">
            <option value="" disabled selected>
              @if (cargandoVersiones()) { Buscando... }
              @else if (!quoteForm.get('model')?.value) { Seleccioná modelo }
              @else { Elegí Versión }
            </option>
            @for (ver of versiones(); track ver.codInfoAuto) {
            <option [value]="ver.codInfoAuto">{{ ver.descripcion }}</option>
            }
          </select>
          @if (cargandoVersiones()) {
          <div class="loading-overlay">
            <div class="spinner"></div>
          </div>
          }
        </div>
      </div>

      <!-- Año -->
      <div class="form-group">
        <label for="year">Año</label>
        <div class="input-container">
          <select id="year" formControlName="year">
            <option value="" disabled selected>Año</option>
            @for (year of years; track year) {
            <option [value]="year">{{ year }}</option>
            }
          </select>
        </div>
      </div>

    </div>

    <button type="submit" [disabled]="!quoteForm.valid" class="btn-submit">
      <span>Continuar</span>
      <div class="btn-icon">
        <hugeicons-icon [icon]="arrowRightIcon" [size]="22" [strokeWidth]="2"></hugeicons-icon>
      </div>
    </button>
  </form>
</div>

<div class="category-header">
    <button class="btn-back" (click)="goBack.emit()">
        <span>←</span> Volver
    </button>
    <h3 class="category-title">Seguros Profesionales</h3>
</div>

<div class="insurance-grid">
    @for (item of coverages; track item.title) {
    <div class="insurance-card fade-in">
        <div class="insurance-card__icon-wrapper">
            <hugeicons-icon [icon]="item.icon" [size]="64" [strokeWidth]="1.5"
                color="var(--color-secondary)"></hugeicons-icon>
        </div>
        <div class="insurance-card__content">
            <h3 class="insurance-card__title">{{ item.title }}</h3>
            <p class="insurance-card__desc">{{ item.desc }}</p>
            <a [routerLink]="[item.link]" [queryParams]="item.queryParams" class="insurance-card__link">
                Ver detalles <span>›</span>
            </a>
        </div>
    </div>
    }
</div>
